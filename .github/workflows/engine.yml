name: Engine (wasm)

# Attempts the decomp -> wasm engine build on Linux. gwtool is written against
# current LLVM APIs (Triple-typed lookups, LLVM 21+), so the toolchain comes from
# apt.llvm.org rather than the distro. Each stage of
# packages/engine/build/build.sh is a gate; the log says which one stopped it.

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/engine/build/**"
      - ".github/workflows/engine.yml"

env:
  LLVM_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }} (all targets) and emsdk
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" zlib1g-dev libzstd-dev python3 ninja-build
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
      - name: Build engine.wasm
        env:
          CLANG: clang-${{ env.LLVM_VERSION }}
          LLVM_CONFIG: llvm-config-${{ env.LLVM_VERSION }}
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash packages/engine/build/build.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: engine-wasm
          path: packages/engine/wasm/engine.wasm
