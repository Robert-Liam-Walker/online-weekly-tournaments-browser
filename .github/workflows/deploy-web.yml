name: Deploy Web

# Builds the Vite bundle, syncs it to the web S3 bucket, invalidates CloudFront.
# Skips cleanly until AWS credentials + bucket are configured (docs/DEPLOY.md).
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: WEB_S3_BUCKET (required), AWS_REGION, CLOUDFRONT_DISTRIBUTION_ID,
#              VITE_API_URL, VITE_SOCKET_URL

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          HAS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && vars.WEB_S3_BUCKET != '' }}
        run: |
          echo "deploy=${HAS_SECRETS}" >> "$GITHUB_OUTPUT"
          [ "${HAS_SECRETS}" = "true" ] || echo "::notice::AWS secrets / WEB_S3_BUCKET not configured; skipping web deploy."

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/engine
      - name: Build web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
        run: npm run build -w apps/web
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Sync to S3
        run: |
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_S3_BUCKET }}" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.WEB_S3_BUCKET }}/index.html" --cache-control "no-cache"
      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
