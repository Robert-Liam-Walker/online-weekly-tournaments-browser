name: Deploy API

# Builds the API + room server image, pushes it to ECR, and rolls it out to
# Elastic Beanstalk as a Docker Compose bundle. Skips cleanly until AWS
# credentials are configured (see docs/DEPLOY.md).
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION, ECR_REPOSITORY, EB_APPLICATION, EB_ENVIRONMENT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          HAS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "deploy=${HAS_SECRETS}" >> "$GITHUB_OUTPUT"
          [ "${HAS_SECRETS}" = "true" ] || echo "::notice::AWS secrets not configured; skipping API deploy."

  deploy:
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'owt-browser-api' }}
      EB_APPLICATION: ${{ vars.EB_APPLICATION || 'owt-browser' }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT || 'owt-browser-api-prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" -t "${REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
      - name: Deploy to Elastic Beanstalk
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Compose bundle: EB writes environment properties to .env in the app
          # root, and the container publishes :80 itself (no managed nginx).
          cat > docker-compose.yml <<EOF
          services:
            api:
              image: ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
              ports:
                - "80:3001"
              env_file: .env
              restart: unless-stopped
          EOF
          zip -r bundle.zip docker-compose.yml
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          KEY="${EB_APPLICATION}/${VERSION_LABEL}.zip"
          aws s3 cp bundle.zip "s3://${BUCKET}/${KEY}"
          aws elasticbeanstalk create-application-version --application-name "${EB_APPLICATION}" --version-label "${VERSION_LABEL}" --source-bundle "S3Bucket=${BUCKET},S3Key=${KEY}"
          aws elasticbeanstalk update-environment --environment-name "${EB_ENVIRONMENT}" --version-label "${VERSION_LABEL}"
      - name: Wait for green on the new version
        env:
          VERSION_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws elasticbeanstalk wait environment-updated --environment-names "${EB_ENVIRONMENT}"
          read -r HEALTH DEPLOYED <<< "$(aws elasticbeanstalk describe-environments --environment-names "${EB_ENVIRONMENT}" --query 'Environments[0].[Health,VersionLabel]' --output text)"
          echo "health=${HEALTH} version=${DEPLOYED}"
          test "${HEALTH}" = "Green"
          test "${DEPLOYED}" = "${VERSION_LABEL}"
